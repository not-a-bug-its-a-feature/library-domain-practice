spring:
  application:
    name: library

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/library
    username: library
    password: library
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis:
  mapper-locations: classpath:mapper/**/*.xml